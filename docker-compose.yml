services:
  meerutrang:
    build:
      context: .
      dockerfile: Dockerfile
    image: meerut-range:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3100}:3100"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
